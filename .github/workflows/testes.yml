name: Testes e build
on: [push, pull_request]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r purehome_agent/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: purehome_agent

  # Compila a imagem do add-on como o Supervisor faz no equipamento (BUILD_FROM do build.yaml), nas duas arquiteturas
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Imagem base do build.yaml
        id: base
        run: echo "from=$(grep '  ${{ matrix.arch }}:' purehome_agent/build.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: purehome_agent
          platforms: ${{ matrix.platform }}
          build-args: BUILD_FROM=${{ steps.base.outputs.from }}
          push: false
          load: true
          tags: purehome-agent:${{ matrix.arch }}
      - name: Agente importa dentro da imagem
        run: docker run --rm --platform ${{ matrix.platform }} --entrypoint python3 -w /opt/purehome purehome-agent:${{ matrix.arch }} -c "import agent, agent.runner, agent.tasks, aiohttp; print('ok', agent.VERSION)"
